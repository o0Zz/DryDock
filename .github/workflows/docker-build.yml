name: Build and push Docker image

on:
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the commit count used as the patch number is correct.
          fetch-depth: 0

      # release/X.Y -> X.Y.<commit count>; tag vX.Y.Z -> X.Y.Z;
      # any other branch -> 0.0.<commit count>-<branch>.
      - name: Compute version
        id: version
        run: |
          count=$(git rev-list --count HEAD)
          ref="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${ref#v}"
          elif [[ "$ref" =~ ^release/([0-9]+)\.([0-9]+) ]]; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${count}"
          else
            version="0.0.${count}-${ref//\//-}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag "latest" only for the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Branch name for pushes to a branch (e.g. main)
            type=ref,event=branch
            # Full semver for version tags (v1.2.3 -> 1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Computed version for release branches (release/1.2 -> 1.2.<count>)
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            # Short commit SHA for traceability
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # arm/v7 is omitted: the uv base image (ghcr.io/astral-sh/uv)
          # only publishes amd64 + arm64 manifests. 64-bit Raspberry Pi OS
          # (Pi 3/4/5) uses arm64.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
