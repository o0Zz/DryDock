[project]
name = "drydock"
version = "0.1.0"
description = "Lightweight self-hosted Docker Compose management UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "docker>=7.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "bcrypt>=4.1",
    "itsdangerous>=2.2",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "alembic>=1.14",
    "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    # Depends()/Query() in argument defaults is the FastAPI idiom, not a bug.
    "B008",
    # Any is the honest type for untyped docker-py sockets and catch-all test stubs.
    "ANN401",
]
