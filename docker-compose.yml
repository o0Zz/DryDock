services:
  drydock:
    build: .
    image: drydock/drydock:latest
    container_name: drydock
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount your Compose repo here — change the host path to yours
      - ./sample-repo:/repo
      - drydock_data:/data
    environment:
      - TZ=Europe/Paris
      - DRYDOCK_REPO_PATH=/repo
      - DRYDOCK_DATA_PATH=/data
      # Allow the built-in UI (same origin) — no CORS needed in prod
      - DRYDOCK_CORS_ORIGINS=[]

volumes:
  drydock_data:
